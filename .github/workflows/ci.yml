name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go fmt ./...
      - run: git diff --exit-code
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build ./cmd/vlc-media-watcher
      - name: Validate Homebrew formula
        if: runner.os == 'macOS'
        run: |
          formula_root="$(mktemp -d)"
          mkdir -p "$formula_root/Formula"
          ./scripts/render-homebrew-formula.sh \
            v0.1.0 \
            0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef \
            "$formula_root/Formula/vlc-media-watcher.rb"
          ruby -c "$formula_root/Formula/vlc-media-watcher.rb"
          grep -F "environment_variables PATH: std_service_path_env" \
            "$formula_root/Formula/vlc-media-watcher.rb"
          brew style "$formula_root/Formula/vlc-media-watcher.rb"

  vulnerability-scan:
    name: Go vulnerability scan (all target OSes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Scan reachable code for every release OS
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          audit_bin="$(go env GOPATH)/bin/govulncheck"
          for target_os in darwin linux windows; do
            GOOS="$target_os" "$audit_bin" ./...
          done

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Scan repository history
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          "$(go env GOPATH)/bin/gitleaks" git --no-banner --redact --exit-code 1
