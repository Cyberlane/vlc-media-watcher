name: Bug report
description: Report a reproducible problem without sharing secrets or private media paths.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Please remove credentials, tokens, and personally identifying media paths before submitting."
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [macOS, Windows, Linux]
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and sanitized logs
    validations:
      required: true
